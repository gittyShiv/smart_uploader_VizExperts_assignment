services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env   #contains MONGO_URI and PORT
    environment:
      PORT: ${PORT:-5000}
    depends_on: []       #using Atlas; no local mongo
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    ports:
      - "4173:4173"