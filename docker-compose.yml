version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env   #this has MONGO_URI=... (Atlas URI)
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI}
    depends_on: []       #no local mongo; we are using Atlas
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    ports:
      - "4173:4173"